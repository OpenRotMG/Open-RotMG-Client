<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; media-src 'self' blob:">
<title>OpenRotMG bot view</title>
<style>
html,body { margin:0;width:100%;height:100%;background:#000;color:#ddd;font:14px sans-serif }
body { display:grid;place-content:center }
#client { width:min(100vw,calc(100vh * 4 / 3));aspect-ratio:4/3 }
ruffle-player { display:block;width:100%;height:100% }
#status { position:fixed;bottom:0;left:0;margin:0;padding:4px 8px;background:#111d;pointer-events:none }
#status:empty { display:none }
#perspective { position:fixed;z-index:2;margin:0;padding:6px;background:#363636;border:1px solid #fff;border-radius:4px;box-shadow:0 0 12px #000 }
#perspective[hidden],#inspect-status:empty { display:none }
#perspective button { color:#fff;background:#363636;border:0;padding:8px 12px;font:bold 14px sans-serif;cursor:pointer }
#perspective button:hover,#perspective button:focus-visible { background:#555 }
#perspective button:disabled { color:#bbb;cursor:default }
#inspect-status { position:fixed;top:0;left:0;margin:0;padding:4px 8px;background:#111d;pointer-events:none }
</style>
<div id="client" aria-label="Read-only native bot view"></div>
<p id="status" role="status">Connecting…</p>
<div id="perspective" hidden><button type="button">View perspective</button></div>
<p id="inspect-status" role="status"></p>
<script src="/vendor/ruffle.js"></script>
<script src="/api/bots/spectator.js?v=e92f54c2fbb76618d7ba10db2dfb567ad4355cfc4f0c64b61448125b832dcd3f"></script>
